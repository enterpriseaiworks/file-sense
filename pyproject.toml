[project]
name = "filesense-workspace"
version = "0.1.0"
description = "Local-drive RAG agent workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.uv.workspace]
members = [
  "packages/configuration",
  "packages/connectors",
  "packages/rag-core",
  "services/api",
  "services/indexer",
  "services/streamlit",
]

[tool.uv.sources]
filesense-configuration = { workspace = true }
filesense-connectors = { workspace = true }
filesense-rag-core = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests", "packages", "services"]
asyncio_mode = "auto"
markers = [
  "integration: requires local infrastructure",
  "e2e: requires the complete application stack",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
