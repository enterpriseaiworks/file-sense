[project]
name = "filesense-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "filesense-configuration",
  "filesense-connectors",
  "filesense-rag-core",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[tool.uv.sources]
filesense-configuration = { workspace = true }
filesense-connectors = { workspace = true }
filesense-rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_agent_api"]
