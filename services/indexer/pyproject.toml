[project]
name = "filesense-indexer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["filesense-configuration", "filesense-connectors", "filesense-rag-core"]

[tool.uv.sources]
filesense-configuration = { workspace = true }
filesense-connectors = { workspace = true }
filesense-rag-core = { workspace = true }

[project.scripts]
filesense-indexer = "desktop_agent_indexer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_agent_indexer"]
