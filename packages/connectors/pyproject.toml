[project]
name = "filesense-connectors"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "filesense-rag-core",
  "httpx>=0.27,<1",
  "langsmith>=0.3.18,<1",
  "pypdf>=5,<7",
  "psycopg[binary]>=3.2,<4",
  "python-docx>=1.1,<2",
]

[tool.uv.sources]
filesense-rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_agent_connectors"]
